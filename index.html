<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتب الأخوين للخدمات التقنية</title>
    <style>
        :root { --primary-color: #1e3a8a; --secondary-color: #f97316; --background-color: #f8fafc; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--background-color); margin: 0; text-align: center; }
        header { background: linear-gradient(135deg, var(--primary-color), #0f172a); color: var(--white); padding: 40px; }
        .container { max-width: 800px; margin: -30px auto 40px; padding: 20px; }
        .box { background: var(--white); padding: 30px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .search-box { display: flex; gap: 10px; margin-top: 20px; }
        input { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 8px; }
        button { background: var(--secondary-color); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; display: none; }
        th, td { border: 1px solid #eee; padding: 12px; }
        th { background: var(--primary-color); color: white; }
        .status-tag { color: #1e3a8a; font-weight: bold; background: #e0f2fe; padding: 5px 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <header>
        <h1>مكتب الأخوين</h1>
        <p>نظام الاستعلام عن حالة الصيانة</p>
    </header>
    <div class="container">
        <div class="box">
            <h3>أدخل رقم الوصل للبحث</h3>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="مثال: 101">
                <button onclick="searchData()">بحث</button>
            </div>
            <table id="resultTable">
                <thead>
                    <tr><th>رقم الوصل</th><th>الاسم</th><th>التكلفة</th><th>الحالة</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            <p id="noResult" style="color:red; display:none; margin-top:20px;">لم يتم العثور على بيانات!</p>
        </div>
    </div>
    <script>
        async function searchData() {
            const query = document.getElementById("searchInput").value.trim();
            const webAppUrl = https://script.google.com/macros/s/AKfycbylQ7auCFd_UZ5CqKb5-2VibevFbuoHBuyhjy6jgGsSC9qXCbc4fzc9zMvTnabTEiFYew/exec"انسخ_الرابط_اللي_طلعلك_من_جوجل_هنا"; // <--- خلي الرابط هنا

            if (!query) return alert("اكتب رقم الوصل");
            document.getElementById("tableBody").innerHTML = "<tr><td colspan='4'>جاري البحث...</td></tr>";
            document.getElementById("resultTable").style.display = "table";

            try {
                const res = await fetch(webAppUrl);
                const data = await res.json();
                const result = data.filter(r => r.id === query);
                const tbody = document.getElementById("tableBody");
                tbody.innerHTML = "";
                if(result.length > 0) {
                    result.forEach(r => {
                        tbody.innerHTML += `<tr><td>${r.id}</td><td>${r.name}</td><td style="color:green; font-weight:bold;">${r.price} دينار</td><td><span class="status-tag">${r.status}</span></td></tr>`;
                    });
                } else {
                    document.getElementById("resultTable").style.display = "none";
                    document.getElementById("noResult").style.display = "block";
                }
            } catch(e) { alert("خطأ في الربط"); }
        }
    </script>
</body>
</html>
