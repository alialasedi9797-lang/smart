<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتب الأخوين للخدمات التقنية</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #f97316;
            --background-color: #f8fafc;
            --text-color: #334155;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), #0f172a);
            color: var(--white);
            text-align: center;
            padding: 50px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 2.8rem;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-top: 10px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .demo-section {
            background: var(--white);
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            margin-top: -40px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin: 25px 0;
        }

        .search-box input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1.1rem;
            outline: none;
        }

        .search-box button {
            background-color: var(--secondary-color);
            color: var(--white);
            border: none;
            padding: 0 35px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            display: none;
            border-radius: 10px;
            overflow: hidden;
        }

        .result-table th, .result-table td {
            border: 1px solid #e2e8f0;
            padding: 15px;
            text-align: center;
        }

        .result-table th {
            background-color: var(--primary-color);
            color: var(--white);
        }

        .price-tag {
            color: #059669;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .status-tag {
            color: #1e3a8a;
            font-weight: bold;
            background-color: #e0f2fe;
            padding: 5px 10px;
            border-radius: 5px;
        }

        footer {
            background-color: #0f172a;
            color: var(--white);
            text-align: center;
            padding: 40px 20px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>مكتب الأخوين</h1>
        <p>للخدمات التقنية وصيانة الأجهزة الذكية</p>
    </header>

    <div class="container">
        <section class="demo-section">
            <h2 style="text-align: center; color: var(--primary-color);">نظام تتبع حالة الصيانة</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="أدخل رقم الوصل...">
                <button onclick="searchData()">بحث</button>
            </div>

            <table class="result-table" id="resultTable">
                <thead>
                    <tr>
                        <th>رقم الوصل</th>
                        <th>اسم الزبون</th>
                        <th>التكلفة الكلية</th>
                        <th>حالة الجهاز</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            
            <p id="noResult" style="color: red; text-align: center; display: none; font-weight: bold;">لم يتم العثور على بيانات!</p>
        </section>
    </div>

    <footer>
        <p>© 2026 مكتب الأخوين - جميع الحقوق محفوظة</p>
    </footer>

    <script>
    async function searchData() {
        const query = document.getElementById("searchInput").value.trim();
        const table = document.getElementById("resultTable");
        const tbody = document.getElementById("tableBody");
        const noResult = document.getElementById("noResult");
        const webAppUrl = "https://script.google.com/macros/s/AKfycbz1SMynIdC2Xefs8j20ZO_Ua05wyOYIcG8cblV6b39SfKTXtbSPkV0pZNsIRf7uD8xWOQ/exec";

        if (!query) return;

        try {
            tbody.innerHTML = "<tr><td colspan='4'>جاري جلب البيانات...</td></tr>";
            table.style.display = "table";

            const response = await fetch(webAppUrl);
            const fullData = await response.json();
            const results = fullData.filter(row => row.id === query);

            tbody.innerHTML = "";
            if(results.length > 0) {
                results.forEach(row => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${row.id}</td>
                        <td>${row.name}</td>
                        <td class="price-tag">${row.price} دينار</td>
                        <td><span class="status-tag">${row.status}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
                table.style.display = "table";
            } else {
                table.style.display = "none";
                noResult.style.display = "block";
            }
        } catch (e) { console.error(e); }
    }
    </script>
</body>
</html>
